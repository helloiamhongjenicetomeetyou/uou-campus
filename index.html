<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="울산대학교 캠퍼스 안에서 두 건물 사이 가장 빠른 길과 지름길을 찾아 줍니다."
    />

    <title>울산대 캠퍼스 길찾기</title>

    <!--
      링크를 붙였을 때 뜨는 미리보기.
      그림과 주소는 절대 주소여야 한다 — 카톡·페이스북 크롤러는 상대 경로를 못 읽는다.
      그림(public/og.png)은 손으로 디자인해 1200×630 으로 맞춘 것이다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="울산대 캠퍼스 길찾기" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="울산대 캠퍼스 길찾기" />
    <meta
      property="og:description"
      content="큰길로 돌지 않고 보행로·계단·지름길로 가는 가장 빠른 길. 건물 이름이나 번호만 넣으면 됩니다."
    />
    <meta property="og:url" content="https://www.uou-campus.site/" />
    <meta property="og:image" content="https://www.uou-campus.site/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="울산대 캠퍼스 길찾기 — 캠퍼스 경로가 그려진 화면 두 장"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 홈 화면에 설치했을 때 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16A152" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS 는 매니페스트의 display 를 안 읽는다. 따로 알려 줘야 주소창이 사라진다. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="캠퍼스 길찾기" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
